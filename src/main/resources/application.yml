spring:
  application:
    name: spring-media-api
  datasource:
    url: jdbc:h2:mem:springdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # show-sql / format_sql are configured above; use logging for readable SQL and bind values.
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.transaction.interceptor: DEBUG
    org.springframework.jdbc.datasource.DataSourceTransactionManager: DEBUG
