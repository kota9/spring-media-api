spring:
  datasource:
    # Quote the URL so YAML treats the query string as one plain scalar.
    url: "jdbc:mysql://localhost:3306/spring_media_api?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
    username: ${DB_USERNAME:springstudy}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update

    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        show_sql: true
